[project]
name = "ecoledirecte-mcp"
version = "0.1.0"
description = "MCP server for the École Directe messaging (unofficial)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "pydantic>=2",
]

[project.scripts]
ecoledirecte-mcp = "ecoledirecte_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "ruff>=0.11",
]

[tool.mypy]
strict = true
packages = ["ecoledirecte_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
